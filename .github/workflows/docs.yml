name: Docs (GitHub Pages)

# Builds the MkDocs site from `docs/` and publishes it to GitHub Pages.
#
# One-time repository setup (Settings -> Pages -> Build and deployment):
#   Source = "GitHub Actions"
# After that every push to main/dev that touches the docs (or a manual run from
# the Actions tab) refreshes https://<owner>.github.io/MEngine/. Both branches
# publish to the same site, so the most recent push wins - the site always shows
# the newest docs.

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  # Allow a manual publish from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed by the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs toolchain
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # --strict turns MkDocs warnings (broken relative links, files missing
      # from the nav, ...) into build errors, so the site can never go live in a
      # half-broken state.
      - name: Build site
        run: python -m mkdocs build --strict

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
