name: Build and Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
            preset: windows-msvc-release
            setup-msvc: true
          - name: Linux (GCC)
            os: ubuntu-latest
            preset: linux-gcc-release
            setup-msvc: false
          - name: Linux (Clang)
            os: ubuntu-latest
            preset: linux-clang-release
            setup-msvc: false
          - name: macOS (AppleClang)
            os: macos-latest
            preset: macos-release
            setup-msvc: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Puts cl.exe (and the MSVC environment) on PATH so the
      # windows-msvc-* Ninja preset can find the MSVC toolchain.
      - name: Setup MSVC (Windows)
        if: matrix.setup-msvc
        uses: ilammy/msvc-dev-cmd@v1

      # GLFW needs the X11/Wayland/OpenGL development headers on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }}
